<body>
  <h1>T20-constants</h1>
  <p>Open the console <code>(Ctrl-shift-i)</code> to see the messages.</p>

  <p><br><br><i>Copy your HTML from the last task and keep building.</i><br><br><br><br></p>

 <form onsubmit="return false;"> 
    <label for="namelabel">Name:</label>
    <input type="text" id="Namefield" name="namelabel">
    <input type="submit" onClick="getFormInputName()">
    <label for="agelabel">Age:</label>
    <input type="number" id="Agefield" name="agelabel">
    <input type="submit" onClick="getFormInputAge()">
    <label for="moneylabel">Pocket Money:</label>
    <input type="number" id="Moneyfield" name="moneylabel">
    <input type="submit" onClick="getFormInputMoney()">
  </form>
  <form onsubmit="return false;"> 
    <label for="countlabel">Insert number of verses:</label>
    <input type="number" id="Countfield" name="countlabel">
    <input type="submit" onClick="getFormInputCountVerses()">
  </form>
  <form onsubmit="return false;"> 
    <label for="shoppinglabel">Add a new item to your shopping list:</label>
    <input type="text" id="Shoppingfield" name="shoppinglabel">
    <input type="submit" onClick="getFormInputShopping()" value="Add Item">
    <input type="submit" onClick="getFormInputList()" value="View List">
  </form>

  <div id="spaceForJavaScriptOutput">

    The output of your script will go here.

  </div>

  <div id="spaceForJavaScriptOutputTwo">

  </div>
